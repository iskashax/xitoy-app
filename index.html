<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xitoydan Buyumlar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: var(--tg-theme-bg-color, #f4f4f5); color: var(--tg-theme-text-color, #333); margin: 0; }
        .container { background: var(--tg-theme-secondary-bg-color, #fff); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: var(--tg-theme-button-color, #ff5722); font-size: 22px; margin-top: 0; }
        label { display: block; font-weight: bold; margin: 15px 0 5px; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid var(--tg-theme-hint-color, #ddd); border-radius: 8px; box-sizing: border-box; font-size: 16px; background: var(--tg-theme-bg-color, #fafafa); color: var(--tg-theme-text-color, #000); }
        .btn { width: 100%; padding: 14px; background: var(--tg-theme-button-color, #ff5722); color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 20px; cursor: pointer; }
        .note { font-size: 12px; color: var(--tg-theme-hint-color, #888); margin-top: 5px; display: block; }
        #result-box { display: none; margin-top: 20px; padding: 15px; background: rgba(76, 175, 80, 0.1); border-radius: 8px; border-left: 4px solid #4caf50; }
        #result-box h3 { margin: 0 0 5px; color: #2e7d32; font-size: 18px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🔗 Товар буюртма қилиш</h2>

        <label>Товар ҳаволаси (Pinduoduo/Taobao):</label>
        <input type="text" id="link" placeholder="Ссилкани бу ерга жойланг">

        <label>Хитойдаги нархи (Юань - ¥):</label>
        <input type="number" id="price" placeholder="Масалан: 45">

        <label>Тахминий вазни (Грамм):</label>
        <input type="number" id="weight" placeholder="Масалан: 300">
        <span class="note">*Оғирлик тахминий. Аниқ вазн товар етиб келганда ўлчанади.</span>

        <button class="btn" onclick="calculateTotal()">Нархни ҳисоблаш</button>

        <div id="result-box">
            <h3>Якуний нарх: <span id="total-uzs">0</span> сўм</h3>
            <span class="note">Бу суммага товар нархи, карго ва хизмат ҳақи киритилган.</span>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let finalData = {};

        function calculateTotal() {
            let link = document.getElementById("link").value;
            let priceYuan = parseFloat(document.getElementById("price").value) || 0;
            let weightGram = parseFloat(document.getElementById("weight").value) || 0;

            if(!link || priceYuan === 0) {
                tg.showAlert("Илтимос, товар ҳаволаси ва нархини киритинг!");
                return;
            }

            // БИЗНЕС СОЗЛАМАЛАРИНГИЗ:
            let kurs = 2000; // 1 Юань = 2000 сўм
            let kargoKg = 72000; // 1 КГ = 72,000 сўм
            let xizmatHaqi = 15000; // Сизнинг соф фойдангиз (15,000 сўм)

            // Математика:
            let tovarSum = priceYuan * kurs;
            let kargoSum = (weightGram / 1000) * kargoKg;
            let jamiSumma = tovarSum + kargoSum + xizmatHaqi;

            document.getElementById("result-box").style.display = "block";
            document.getElementById("total-uzs").innerText = jamiSumma.toLocaleString("uz-UZ");

            // Ботга жўнатиладиган маълумотлар тўплами
            finalData = { 
                link: link, 
                priceYuan: priceYuan, 
                weight: weightGram, 
                totalSum: jamiSumma 
            };

            tg.MainButton.text = "БУЮРТМА БЕРИШ";
            tg.MainButton.show();
        }

        tg.MainButton.onClick(function() {
            tg.sendData(JSON.stringify(finalData));
            tg.close();
        });
    </script>
</body>
</html>
