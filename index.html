<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">

<style>

body.light{--bg:#f7efe6;--cd:#fff;--cd2:#f3e4d6;--tx:#2a0f0d;--mu:#8a6a62;--ln:#00000014}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .3s}

.card{background:var(--cd);border:1px solid var(--ln);border-radius:22px;padding:16px}

.mu{color:var(--mu);font-size:13px}.gd{color:var(--gd)}

#splash.off{opacity:0;pointer-events:none}
.logo3d{width:210px;height:210px;border-radius:50%;object-fit:cover;border:3px solid var(--gd);animation:pulse 1.8s ease-in-out infinite;box-shadow:0 0 50px #f0c04f66,0 20px 40px #000}

.bar{width:230px;height:8px;border-radius:9px;background:#ffffff1c;overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--rd),var(--gd));transition:width .3s}

.auth{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.auth .logo3d{width:150px;height:150px;animation-duration:3s}

form{width:100%;text-align:left}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.tg:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--rd)}.tg.on:after{left:23px}

nav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:20;display:flex;gap:4px;padding:6px;border-radius:30px;background:#1e0e10cc;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid #f0c04f33;box-shadow:0 14px 34px #0009}
body.light nav{background:#ffffffdd}

nav button span{font-size:20px}nav .on{background:linear-gradient(var(--rd),var(--rd2));color:#fff}

#sh{position:fixed;inset:0;z-index:50;display:none}#sh.on{display:block}
.bk{position:absolute;inset:0;background:#000a}
.sb{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 20px);border-top:1px solid #f0c04f55;animation:up .25s}
.lite .sb{animation:none}@keyframes up{from{transform:translateY(60px);opacity:0}}
.chip{display:inline-block;padding:9px 14px;margin:0 6px 8px 0;border-radius:14px;background:var(--cd2);border:1px solid var(--ln);cursor:pointer}
.chip.on{background:var(--rd);border-color:var(--gd);color:#fff}
.st{display:inline-block;font-size:12px;padding:3px 10px;border-radius:10px;background:var(--cd2);color:var(--gd)}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:50%;transform:translate(-50%,-90px);background:var(--gd);color:#3a1500;font-weight:700;padding:11px 20px;border-radius:20px;z-index:99;transition:.3s;max-width:90%;text-align:center}
#toast.on{transform:translate(-50%,0)}
.empty{text-align:center;padding:50px 20px;color:var(--mu)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

 me(){const u=me();return{u:u?Object.assign({},u,{pass:undefined}):null,orders:u?db.orders.filter(o=>o.uid===u.id).reverse():[],all:isAdmin()?db.orders.length:0,products:db.products,cfg:db.cfg}},

 ${reg?`<input id=n placeholder="${T('name')}" required>`:''}<input id=p type=tel placeholder="+998 __ ___ __ __" required>

function homeV(){const u=S.u;
 return`<div class=row><div class=av>${esc((u.name||'?')[0])}</div><div><h4>${esc(u.name)}</h4><span class=mu>${T('welcome')} 👋</span></div><div class=coin>🪙 ${u.coins}</div></div>
 <div class=bal><span style="opacity:.8">${T('bal')}</span><br><b>${money(u.bal)}</b> so'm${u.disc?`<div style="font-size:13px;margin-top:4px;color:var(--gd)">🏷 ${T('disc')}: ${money(u.disc)} so'm</div>`:''}

 ${shopBar()}<div class=grid>${shown().map(p=>`<div class=pc onclick="pick(${p.id})"><div class=pi style="background-image:url('${esc(p.img)}')">${p.img?'':'📦'}<span onclick="event.stopPropagation();fv(${p.id})" style="position:absolute;top:4px;right:8px;font-size:20px">${P.fav.includes(p.id)?'❤️':'🤍'}</span>${p.sold>20?'<b class=tag>HIT</b>':''}</div><h4>${esc(p.name)}</h4><p>${money(price(p))} so'm</p>${p.sold?`<span class=mu>🔥 ${p.sold}</span>`:''}</div>`).join('')}</div>`}
function pick(id,keep){const p=S.products.find(x=>x.id==id);if(!keep)sel={id,c:0,s:0,g:'auto'};
 const ch=(a,k)=>a.map((x,i)=>`<span class="chip ${sel[k]==i?'on':''}" onclick="sel.${k}=${i};pick(${id},1)">${esc(x)}</span>`).join('');
 sheet(`<h1>${esc(p.name)}</h1><p class="gd" style="font-size:22px;font-weight:800;margin:6px 0 14px">${money(price(p))} so'm</p>
 <p class=mu>${T('color')}</p>${ch(p.colors,'c')}<p class=mu>${T('size')}</p>${ch(p.sizes,'s')}<p class=mu>${T('cargo')}</p>
 <span class="chip ${sel.g=='auto'?'on':''}" onclick="sel.g='auto';pick(${id},1)">${T('auto')}</span><span class="chip ${sel.g=='avia'?'on':''}" onclick="sel.g='avia';pick(${id},1)">${T('avia')}</span>
 <button class="b3 g" style="margin-top:14px" onclick="doBuy(${id})">${T('buy')}</button>`)}
function doBuy(id){const p=S.products.find(x=>x.id==id);closeS();go(async()=>{await call('buy',{pid:id,color:p.colors[sel.c],size:p.sizes[sel.s],cargo:sel.g});tab='hist'},'bought')}
function topUp(){sheet(`<h1>💳 ${T('top')}</h1><p class=mu style="margin:8px 0">${T('topD')}</p><div class=idc onclick="cp('${CFG.CARD}')" style="font-size:20px;padding:12px 16px">${CFG.CARD} 📋</div><div style="height:14px"></div>${suppBtns()}`)}
const suppBtns=()=>CFG.SUPPORT.map((u,i)=>`<button class="b3 ${i?'':'g'}" style="margin-bottom:12px" onclick="openTG('https://t.me/${u}')">💬 @${esc(u)}</button>`).join('');
function suppS(){sheet(`<h1>💬 ${T('supp')}</h1><p class=mu style="margin:8px 0 16px">${T('suppD')}</p>${suppBtns()}`)}
function histV(){return`<h1>📦 ${T('hist')}</h1>${(S.tx||[]).length?`<div class=card style="margin-top:12px">${S.tx.slice(0,5).map(x=>`<div class="row sp"><span class=mu>${esc(x.w)}</span><b class="${x.a>0?'gd':''}">${x.a>0?'+':''}${money(x.a)}</b></div>`).join('')}</div>`:''}<div style="margin-top:14px;display:grid;gap:10px">${S.orders.length?S.orders.map(o=>`<div class=card><div class="row sp"><b>${esc(o.name)}</b><span class=st>${T('st'+o.status)}</span></div><p class=mu style="margin:6px 0">${esc(o.track)} · ${esc(o.color)} · ${esc(o.size)} · ${o.cargo=='avia'?'Avia':'Avto'}</p><div class="row sp"><span class=gd><b>${money(o.price)} so'm</b></span>${o.weight?`<span class=mu>${o.weight} g${o.due?' · 🚚 '+money(o.due)+" so'm":''}</span>`:''}</div>${o.due?`<button class="b3 g" style="margin-top:10px;padding:10px" data-t="${esc(o.track)}" onclick="go(()=>call('paydue',{track:this.dataset.t}),'done')">🚚 ${T('pay')} · ${money(o.due)}</button>`:''}</div>`).join(''):`<div class=empty>📭<br>${T('none')}</div>`}</div>`}
const li=(i,t,d,r,f)=>`<div class=li onclick="${f}"><div class=ic>${i}</div><div><b>${t}</b><small>${d}</small></div>${r}</div>`;
const chev='<span class=mu style="font-size:22px">›</span>',tgl=on=>`<span class="tg ${on?'on':''}"></span>`;
function profV(){const u=S.u;
 return`<div class=card><div class=row><div class=av style="width:64px;height:64px;font-size:26px">${esc((u.name||'?')[0])}</div><div><h4>${esc(u.name)}</h4><div class=gd>${esc(u.phone)}</div><div class=idc onclick="cp('${esc(u.id)}')">ID: ${esc(u.id)} 📋</div></div></div>
 <div class=pf><div><span class=mu>${T('bal').toUpperCase()}</span><br><b>${money(u.bal)}</b> <span class=mu>so'm</span></div><div><span class=mu>${T('cash').toUpperCase()}</span><br><b class=gd>${u.coins}</b></div></div></div>
 <h3>${T('lang').toUpperCase()}</h3>${langSeg()}<h3>${T('svc').toUpperCase()}</h3>
 <div class=card style="padding:6px 14px">${li('👥',T('inv'),T('invD'),chev,'invS()')}${li('🪙',T('promo'),T('promoD'),chev,'promoS()')}${li('💬',T('supp'),T('suppD'),chev,'suppS()')}
 ${li('⚡',T('lite'),T('liteD'),tgl(P.lite),'P.lite=P.lite?0:1;savP();hap();render()')}${li('🌙',T('night'),T('nightD'),tgl(!P.dark),'P.dark=P.dark?0:1;savP();hap();render()')}${li('🛡️',T('sec'),T('secD'),chev,'secS()')}</div>
 <button class="chip" style="margin-top:16px;width:100%;text-align:center" onclick="out()">${T('out')}</button>`}
function out(){if(CFG.API){S={u:null};render()}else{load();delete db.tg[TID];save();S={u:null};au='';render()}}
function invS(){const l=`https://t.me/${CFG.BOT}?start=ref_${S.u.id}`;sheet(`<h1>👥 ${T('inv')}</h1><p class=mu style="margin:8px 0 14px">${T('invD')} (+${CFG.REF_BONUS} 🪙)</p><div class=idc style="word-break:break-all" onclick="cp('${l}')">${l} 📋</div><button class="b3 g" style="margin-top:16px" onclick="openTG('https://t.me/share/url?url='+encodeURIComponent('${l}'))">${T('send')}</button>`)}
function promoS(){sheet(`<h1>🎟 ${T('promo')}</h1><p class=mu style="margin:8px 0">🪙 ${S.u.coins} · 1 🪙 = ${CFG.COIN} so'm</p>
 <input id=c1 placeholder="${T('code')}"><button class=b3 onclick="go(()=>call('promoUse',{code:v('c1')}),'done');closeS()">${T('use')}</button><div style="height:18px"></div>
 <input id=c2 type=number placeholder="${T('coins')}"><button class="b3 g" onclick="mk()">${T('create')}</button>`)}
async function mk(){try{const c=await call('promoNew',{n:v('c2')});S=await call('me');render();sheet(`<h1>🎟 ${T('code')}</h1><div class=idc style="font-size:26px;padding:14px 20px" onclick="cp('${c}')">${c} 📋</div>`)}catch(e){toast(T(e.message))}}
function secS(){const u=S.u;sheet(`<h1>🛡️ ${T('sec')}</h1><div style="height:12px"></div><input id=n value="${esc(u.name)}" placeholder="${T('name')}"><select id=r>${["Farg'ona","Toshkent","Boshqa viloyatlar"].map(x=>`<option ${x==u.region?'selected':''}>${x}</option>`).join('')}</select><input id=a value="${esc(u.addr)}" placeholder="${T('addr')}"><input id=w type=password placeholder="${T('newpass')}"><button class="b3 g" onclick="go(()=>call('prof',{name:v('n'),region:$('#r').value,addr:v('a'),pass:v('w')}),'done');closeS()">${T('save')}</button>`)}
/* admin */
const f=(id,ph,t)=>`<input id=${id} ${t?'type='+t:''} placeholder="${ph}">`,btn=(t,a,keys)=>`<button class="b3 g" style="margin-bottom:6px" onclick="go(()=>call('${a}',{${keys}}),'done')">${t}</button>`;
const sec=(t,h)=>`<div class=card style="margin-bottom:12px"><h4 style="margin-bottom:10px">${t}</h4>${h}</div>`;

 ${sec('📈 '+T('rate'),f('a1',T('rate'),'number')+f('a2',T('fee'),'number')+f('a3',T('usd'),'number')+btn(T('save'),'cfg',"rate:v('a1'),fee:v('a2'),usd:v('a3')"))}
 ${sec('💰 '+T('addm'),f('b1','XB-1234')+f('b2',T('sum'),'number')+btn(T('addm'),'addm',"id:v('b1'),sum:v('b2')"))}
 ${sec('🚚 '+T('track'),f('c1','XB-1234-01')+`<select id=c2><option value=1>${T('st1')}</option><option value=2>${T('st2')}</option><option value=3>${T('st3')}</option></select>`+f('c3',T('weight'),'number')+btn(T('save'),'status',"track:v('c1'),st:$('#c2').value,w:v('c3')"))}
  ${sec('🎟 '+T('promo'),f('e1',T('code'))+f('e2',T('dsc'),'number')+btn(T('add'),'addpromo',"code:v('e1'),val:v('e2')"))}
 ${sec('🔑 '+T('resetp'),f('g1',T('pk'))+f('g2',T('newpass'))+btn(T('resetp'),'resetp',"k:v('g1'),pass:v('g2')"))}`}
let q='',cat='',fo=0,cur='',TH=[];
const rg=()=>{render();const i=$('#q');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}};
const shown=()=>S.products.filter(p=>(!cat||p.cat===cat)&&(!fo||P.fav.includes(p.id))&&p.name.toLowerCase().includes(q.toLowerCase()));
const shopBar=()=>{const cs=[...new Set(S.products.map(p=>p.cat).filter(Boolean))];return`<input id=q placeholder="🔍 ${T('search')}" value="${esc(q)}" oninput="q=this.value;rg()" style="margin-top:14px"><div style="overflow-x:auto;white-space:nowrap;margin-bottom:10px"><span class="chip ${fo?'on':''}" onclick="fo=!fo;rg()">❤️</span>${['',...cs].map(c=>`<span class="chip ${cat===c?'on':''}" data-c="${esc(c)}" onclick="cat=this.dataset.c;rg()">${c?esc(c):T('all')}</span>`).join('')}</div>`};
const fv=id=>{P.fav=P.fav.includes(id)?P.fav.filter(x=>x!==id):[...P.fav,id];savP();hap();rg()};
const delB=(a,k,id)=>`<button class=chip data-k="${id}" onclick="go(()=>call('${a}',{${k}:this.dataset.k}),'done')">🗑</button>`;
const admMgr=()=>sec('👥 '+T('admins'),(S.admins||[]).map(a=>`<div class="row sp" style="margin:6px 0"><span>${esc(a.name||'-')} · ${a.id}</span>${delB('deladm','tid',a.id)}</div>`).join('')+f('m1',T('tid'),'number')+f('m2',T('aname'))+btn(T('add'),'addadm',"tid:v('m1'),name:v('m2')"));
function admV(){const o=S.role==='owner'||(!CFG.API&&location.search.includes('admin'));
 const pl=S.products.filter(p=>o||p.by===Number(TID)).map(p=>`<div class="row sp" style="margin:6px 0"><span>${esc(p.name)}</span>${delB('delp','id',p.id)}</div>`).join('');
 return`<h1>⚙️ ${T('adm')}</h1><p class=mu style="margin:4px 0 14px">${o?'👑 Owner':'🛠 Admin'} · Orders: ${S.all}</p>
 ${sec('🛍 '+T('add'),f('d1',T('pname'))+f('d2',T('img'))+f('d3',T('yuan'),'number')+f('d6',T('cat'))+f('d4',T('colors'))+f('d5',T('sizes'))+btn(T('add'),'addp',"name:v('d1'),img:v('d2'),yuan:v('d3'),cat:v('d6'),colors:v('d4'),sizes:v('d5')"))}
 ${pl?sec('📋 '+T('mine'),pl):''}${o?ordL()+admMgr()+ownV():''}`}
const ordL=()=>sec('📦 '+T('hist'),(S.ords||[]).map(x=>`<div style="margin:8px 0"><b>${esc(x.p)}</b> <span class=st>${T('st'+x.st)}</span><br><span class=mu>${esc(x.t)} · ${esc(x.n||'')} · ${esc(x.ph||'')} · ${money(x.s)}</span></div>`).join('')||'-');
const bub=m=>`<div style="display:flex;justify-content:${m.f==='u'?'flex-end':'flex-start'}"><div style="max-width:80%;padding:9px 13px;margin:4px 0;border-radius:16px;background:${m.f==='u'?'var(--rd)':'var(--cd2)'};color:${m.f==='u'?'#fff':'var(--tx)'}">${esc(m.t)}</div></div>`;
const sendB=a=>`<div class=row style="margin-top:12px"><input id=cm placeholder="${T('msg')}" style="margin:0"><button class="b3 g" style="width:auto;padding:14px 18px" onclick="${a}">➤</button></div>`;
const sendM=()=>{const t=v('cm');if(t)go(()=>call('msg',{t}))};
const openT=c=>go(async()=>{cur=c;TH=await call('thread',{code:c})});
const replyM=()=>{const t=v('cm');if(t)go(async()=>{await call('reply',{code:cur,t});TH=await call('thread',{code:cur})})};
function chatV(){const em=`<div class=empty>${T('nomsg')}</div>`;
 if(S.role==='user'||(!S.role&&!isAdmin()))return`<h1>💬 ${T('chat')}</h1><div style="margin-top:12px">${(S.msgs||[]).map(bub).join('')||em}</div>${sendB('sendM()')}`;
 if(cur)return`<div class=row><button class=chip onclick="cur='';render()">←</button><h1>${esc(cur)}</h1></div><div style="margin-top:12px">${TH.map(bub).join('')}</div>${sendB('replyM()')}`;
 return`<h1>💬 ${T('chat')}</h1><div class=card style="margin-top:12px;padding:6px 14px">${(S.inbox||[]).map(i=>li('👤',esc(i.n||i.c),esc(i.t),'',`openT('${esc(i.c)}')`)).join('')||em}</div>`}
function navV(){const t=[['home','🏠',T('home')],['hist','🕘',T('hist')],['chat','💬',T('chat')],['prof','👤',T('prof')]];if(isAdmin())t.push(['adm','⚙️',T('adm')]);
 return'<nav>'+t.map(x=>`<button class="${tab==x[0]?'on':''}" onclick="tab='${x[0]}';hap();render();scrollTo(0,0)"><span>${x[1]}</span>${x[2]}</button>`).join('')+'</nav>'}
/* ========== BOSHLASH ========== */
(async function(){savP();const pg=$('#pg');let w=0;const iv=setInterval(()=>{w=Math.min(w+Math.random()*14,90);pg.style.width=w+'%'},220);
 const t0=Date.now();try{S=await call('me')}catch(e){S={u:null,orders:[],products:[],cfg:{rate:1800,fee:20000}};toast('⚠ '+e.message)}
 await new Promise(r=>setTimeout(r,Math.max(0,1600-(Date.now()-t0))));clearInterval(iv);pg.style.width='100%';render();
 setTimeout(()=>$('#splash').classList.add('off'),350);setTimeout(()=>$('#splash').remove(),900)})();
