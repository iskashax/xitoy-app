<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xitoydan Buyurtma</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-secondary-bg-color, #f0f2f5);
            --card-bg: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #1c1c1e);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --btn-color: var(--tg-theme-button-color, #007aff);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --accent-color: #ff5000; /* Taobao/Pinduoduo uslubidagi to'q sariq rang */
        }

        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; box-sizing: border-box; }
        
        .header { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; font-size: 20px; font-weight: 700; color: var(--text-color); }
        .header span { font-size: 24px; }

        .card { background-color: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        
        .input-group { margin-bottom: 16px; }
        .input-group:last-child { margin-bottom: 0; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--hint-color); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        input { width: 100%; padding: 14px; background-color: var(--bg-color); border: 1px solid transparent; border-radius: 12px; font-size: 16px; color: var(--text-color); box-sizing: border-box; transition: all 0.3s; outline: none; }
        input:focus { border-color: var(--accent-color); background-color: var(--card-bg); box-shadow: 0 0 0 3px rgba(255, 80, 0, 0.1); }
        
        .btn-main { width: 100%; padding: 16px; background-color: var(--accent-color); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: transform 0.1s; }
        .btn-main:active { transform: scale(0.98); }

        .result-card { display: none; background-color: var(--card-bg); border-radius: 16px; padding: 20px; margin-top: 15px; border: 2px solid var(--accent-color); box-shadow: 0 4px 12px rgba(255, 80, 0, 0.15); }
        .result-header { text-align: center; font-size: 14px; color: var(--hint-color); font-weight: 600; margin-bottom: 10px; }
        .total-price { text-align: center; font-size: 28px; font-weight: 800; color: var(--accent-color); margin-bottom: 15px; }
        
        .breakdown { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; color: var(--text-color); }
        .breakdown span:last-child { font-weight: 600; }
        .breakdown.divider { border-top: 1px dashed var(--hint-color); padding-top: 8px; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="header">
        <span>📦</span> Экспресс Буюртма
    </div>

    <div class="card">
        <div class="input-group">
            <label>🔗 Pinduoduo / Taobao ҳаволаси</label>
            <input type="text" id="link" placeholder="Товар ссилкасини қўйинг">
        </div>
        <div class="input-group">
            <label>💴 Хитойдаги нархи (Юань)</label>
            <input type="number" id="price" placeholder="Масалан: 45">
        </div>
        <div class="input-group">
            <label>⚖️ Тахминий вазни (Грамм)</label>
            <input type="number" id="weight" placeholder="Масалан: 300">
        </div>
    </div>

    <button class="btn-main" onclick="calculateTotal()">
        <span>🧮</span> Нархни ҳисоблаш
    </button>

    <div class="result-card" id="result-box">
        <div class="result-header">СИЗНИНГ ЯКУНИЙ ХАРАЖАТИНГИЗ</div>
        <div class="total-price" id="total-uzs">0 сўм</div>
        
        <div class="breakdown">
            <span>Товар нархи:</span>
            <span id="b-tovar">0 сўм</span>
        </div>
        <div class="breakdown">
            <span>Карго хизмати:</span>
            <span id="b-kargo">0 сўм</span>
        </div>
        <div class="breakdown">
            <span>Бизнинг хизмат:</span>
            <span id="b-xizmat">0 сўм</span>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        // Телеграм темасига мослашиш
        tg.ready();
        
        let finalData = {};

        function calculateTotal() {
            let link = document.getElementById("link").value;
            let priceYuan = parseFloat(document.getElementById("price").value) || 0;
            let weightGram = parseFloat(document.getElementById("weight").value) || 0;

            if(!link || priceYuan === 0) {
                tg.showAlert("Илтимос, товар ҳаволаси ва нархини киритинг!");
                return;
            }

            let kurs = 2000; 
            let kargoKg = 72000; 
            let xizmatHaqi = 15000; 

            let tovarSum = priceYuan * kurs;
            let kargoSum = (weightGram / 1000) * kargoKg;
            let jamiSumma = tovarSum + kargoSum + xizmatHaqi;

            // Натижани UI да кўрсатиш
            document.getElementById("result-box").style.display = "block";
            document.getElementById("total-uzs").innerText = jamiSumma.toLocaleString("uz-UZ") + " сўм";
            
            document.getElementById("b-tovar").innerText = tovarSum.toLocaleString("uz-UZ") + " сўм";
            document.getElementById("b-kargo").innerText = kargoSum.toLocaleString("uz-UZ") + " сўм";
            document.getElementById("b-xizmat").innerText = xizmatHaqi.toLocaleString("uz-UZ") + " сўм";

            finalData = { 
                link: link, 
                priceYuan: priceYuan, 
                weight: weightGram, 
                totalSum: jamiSumma 
            };

            // Асосий Телеграм тугмасини чиқариш
            tg.MainButton.text = "БУЮРТМАНИ ТАСДИҚЛАШ";
            tg.MainButton.color = "#ff5000";
            tg.MainButton.textColor = "#ffffff";
            tg.MainButton.show();
        }

        tg.MainButton.onClick(function() {
            tg.sendData(JSON.stringify(finalData));
            tg.close();
        });
    </script>
</body>
</html>
